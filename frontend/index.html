<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        header { text-align: center; color: white; margin-bottom: 30px; }
        header h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .card h2 { margin-bottom: 20px; color: #667eea; }
        .portfolio-summary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .portfolio-summary h2 { color: white; }
        .total-value { text-align: center; padding: 20px; }
        .value { font-size: 2.5rem; font-weight: bold; }
        form { display: flex; gap: 10px; flex-wrap: wrap; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; }
        button { padding: 10px 20px; background: #667eea; color: white; border: none; border-radius: 6px; cursor: pointer; }
        button:hover { background: #5a67d8; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f7f7f7; }
        .positive { color: #48bb78; }
        .negative { color: #f56565; }
        .neutral { color: #ecc94b; }
        .sentiment-card { background: #f7f7f7; padding: 15px; border-radius: 8px; margin-bottom: 10px; }
        .loading { text-align: center; padding: 20px; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Financial Portfolio Tracker</h1>
            <p>with AI Sentiment Analysis</p>
        </header>
        <div class="dashboard">
            <div class="card portfolio-summary">
                <h2>Portfolio Summary</h2>
                <div class="total-value">
                    <h3>Total Value</h3>
                    <div class="value" id="totalValue">$0.00</div>
                </div>
            </div>
            <div class="card">
                <h2>Add Stock</h2>
                <form id="addStockForm">
                    <input type="text" id="symbol" placeholder="Symbol (e.g., AAPL)" required>
                    <input type="number" id="shares" placeholder="Shares" step="0.01" required>
                    <input type="number" id="price" placeholder="Price (optional)" step="0.01">
                    <button type="submit">Add to Portfolio</button>
                </form>
            </div>
            <div class="card">
                <h2>Your Holdings</h2>
                <div style="overflow-x: auto;">
                    <table id="holdingsTable">
                        <thead><tr><th>Symbol</th><th>Shares</th><th>Price</th><th>Value</th><th>Gain/Loss</th><th>Sentiment</th><th>Action</th></tr></thead>
                        <tbody id="holdingsBody"><tr><td colspan="7" class="loading">Loading...</td></tr></tbody>
                    </table>
                </div>
            </div>
            <div class="card">
                <h2>Sentiment Analysis</h2>
                <div id="sentimentContainer"><p class="loading">Add stocks to see sentiment</p></div>
            </div>
        </div>
    </div>
    <script>
        const API = 'http://localhost:5000';
        async function load() {
            try {
                const res = await fetch(`${API}/api/dashboard`);
                const data = await res.json();
                document.getElementById('totalValue').textContent = `$${data.portfolio.total_value.toFixed(2)}`;
                const tbody = document.getElementById('holdingsBody');
                if (data.portfolio.holdings.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="loading">No holdings. Add some stocks!</td></tr>';
                } else {
                    tbody.innerHTML = data.portfolio.holdings.map(h => {
                        const s = data.sentiments[h.symbol] || {};
                        const cls = s.overall_sentiment?.toLowerCase() || 'neutral';
                        return `<tr>
                            <td><strong>${h.symbol}</strong></td>
                            <td>${h.shares}</td>
                            <td>$${h.current_price.toFixed(2)}</td>
                            <td>$${h.current_value.toFixed(2)}</td>
                            <td class="${h.gain_loss >= 0 ? 'positive' : 'negative'}">${h.gain_loss >= 0 ? '+' : ''}$${h.gain_loss.toFixed(2)} (${h.gain_loss >= 0 ? '+' : ''}${h.gain_loss_percent.toFixed(2)}%)</td>
                            <td class="${cls}">${s.overall_sentiment || 'NEUTRAL'} ${s.icon || ''}</td>
                            <td><button onclick="remove('${h.symbol}', ${h.shares})" style="background:#f56565;padding:5px 10px;">Remove</button></td>
                        </tr>`;
                    }).join('');
                }
                const sentimentDiv = document.getElementById('sentimentContainer');
                if (Object.keys(data.sentiments).length === 0) {
                    sentimentDiv.innerHTML = '<p class="loading">Add stocks to see sentiment</p>';
                } else {
                    sentimentDiv.innerHTML = Object.entries(data.sentiments).map(([sym, s]) => `
                        <div class="sentiment-card">
                            <h3>${sym} ${s.icon || '📊'}</h3>
                            <div class="${s.overall_sentiment?.toLowerCase() || 'neutral'}">${s.overall_sentiment}</div>
                            <div>Score: ${(s.overall_score * 100).toFixed(1)}%</div>
                            <div>Fear & Greed: ${s.fear_greed_index}</div>
                            <small>${s.trading_advice || ''}</small>
                        </div>
                    `).join('');
                }
            } catch(e) {
                console.error(e);
                document.getElementById('holdingsBody').innerHTML = '<tr><td colspan="7" class="loading">Error: Make sure backend is running!</td></tr>';
            }
        }
        async function remove(symbol, shares) {
            if(confirm(`Remove ${shares} shares of ${symbol}?`)) {
                await fetch(`${API}/api/portfolio/remove`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({symbol, shares})
                });
                load();
            }
        }
        document.getElementById('addStockForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const symbol = document.getElementById('symbol').value.toUpperCase();
            const shares = parseFloat(document.getElementById('shares').value);
            const price = document.getElementById('price').value;
            await fetch(`${API}/api/portfolio/add`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({symbol, shares, purchase_price: price ? parseFloat(price) : null})
            });
            document.getElementById('addStockForm').reset();
            load();
        });
        load();
        setInterval(load, 10000);
    </script>
</body>
</html>
<div class="model-badge" id="modelBadge">
    🤖 AI Model: Loading...
</div>
